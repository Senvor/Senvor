<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{tagline}}">
<meta name="theme-color" content="#15132b">
<link rel="canonical" href="{{url}}">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta property="og:type" content="article">
<meta property="og:site_name" content="Senvor">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}} — Senvor">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} — Senvor">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>{{title}} — Senvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/">senvor</a>
  <nav aria-label="Main"><a href="/#work">← All work</a></nav>
</div></header>
<main id="top" tabindex="-1"><div class="wrap">
  <section>
    <h1>{{title}}<span class="tag">{{status}}</span></h1>
    <p class="role">{{tagline}}</p>
    {{imageTag}}
    <ul class="chips">{{stack}}</ul>
    <h2>What I built</h2><p>{{built}}</p>
    <h2>Where I got stuck</h2><p>{{stuck}}</p>
    <h2>What I learned</h2><p>{{learned}}</p>
    <p class="now" data-repo="{{repo}}"></p>
    <p><a href="https://github.com/Senvor/{{repo}}">Repository</a></p>
  </section>
</div></main>
<footer><div class="wrap">© 2026 Senvor</div></footer>
<script type="module" src="/github-status.js"></script>
</body>
</html>
