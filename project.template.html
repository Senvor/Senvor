<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{tagline}}">
<meta name="theme-color" content="#15132b">
<link rel="canonical" href="{{url}}">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta property="og:type" content="article">
<meta property="og:site_name" content="Senvor">
<meta property="og:url" content="{{url}}">
<meta property="og:title" content="{{title}} — Senvor">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} — Senvor">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>{{title}} — Senvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/project.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/">senvor</a>
  <nav aria-label="Main"><a href="/#work">All work</a><a href="/#connect">Connect</a></nav>
</div></header>
<main id="top" tabindex="-1"><div class="wrap pj">
  <a class="crumb" href="/#work">← Back to all work</a>
  <div class="pj-head">
    <div class="pj-kicker"><span>{{category}}</span>{{statusPill}}</div>
    <h1>{{title}}</h1>
    <p class="pj-tagline">{{tagline}}</p>
    <div class="pj-actions">{{actions}}</div>
  </div>
  {{hero}}
  <div class="pj-grid">
    <div class="pj-body">
      {{sections}}
      {{gallery}}
    </div>
    <aside class="pj-side">
      <dl>
        <dt>Type</dt><dd>{{category}}</dd>
      </dl>
      {{stackBlock}}
      <dl>
        <dt>Activity</dt><dd><span class="now" data-repo="{{repo}}">See the repository</span></dd>
      </dl>
    </aside>
  </div>
  {{hire}}
  <nav class="pj-nav" aria-label="More projects">{{prevNext}}</nav>
</div></main>
<footer><div class="wrap">© 2026 Senvor</div></footer>
<script type="module" src="/github-status.js"></script>
</body>
</html>
