name: Generate Skills SVG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/scripts/generate-skills.js'
      - '.github/workflows/skills.yml'

  schedule:
    - cron: '0 1 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SVG
        run: node .github/scripts/generate-skills.js

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true
          force_orphan: false
